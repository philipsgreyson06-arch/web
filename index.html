<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery Proxy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Loading spinner */
        .loader {
            border: 4px solid #374151;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Thumbnail hover effect */
        .thumbnail-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .thumbnail-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Video modal backdrop blur */
        .modal-backdrop {
            backdrop-filter: blur(5px);
        }

        /* Pagination button styles */
        .pagination-btn {
            transition: all 0.2s ease;
        }
        .pagination-btn:hover:not(.active):not(:disabled) {
            background-color: #3b82f6;
            color: white;
        }
        .pagination-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        /* Image lazy loading placeholder */
        .img-placeholder {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Video player controls */
        video::-webkit-media-controls-panel {
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        /* Responsive video player - handles both portrait and landscape */
        .video-responsive {
            max-width: 90vw;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* Portrait video specific adjustments */
        @media (max-width: 640px) {
            .video-responsive {
                max-width: 95vw;
                max-height: 70vh;
            }
        }

        /* Landscape mode on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .video-responsive {
                max-height: 85vh;
                max-width: 95vw;
            }
        }

        #videoContainer {
            min-width: 280px;
            min-height: 200px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center gap-4">
                <!-- Home Button -->
                <button id="homeBtn" class="flex-shrink-0 p-3 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors" title="Home">
                    <i class="fas fa-home text-xl"></i>
                </button>
                
                <!-- Search Box -->
                <div class="flex-1 relative">
                    <form id="searchForm" class="flex">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search videos..." 
                            class="w-full px-4 py-3 pr-12 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 text-white placeholder-gray-400"
                        >
                        <button 
                            type="submit" 
                            class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-blue-500 transition-colors"
                        >
                            <i class="fas fa-search text-lg"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Current Search/Page Info -->
        <div id="pageInfo" class="mb-4 text-gray-400 text-sm hidden">
            <span id="pageInfoText"></span>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-400">Loading videos...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden text-center py-20">
            <i class="fas fa-exclamation-triangle text-5xl text-yellow-500 mb-4"></i>
            <p class="text-xl text-gray-300 mb-2">Oops! Something went wrong</p>
            <p id="errorText" class="text-gray-500 mb-4"></p>
            <button onclick="retryLoad()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">
                <i class="fas fa-redo mr-2"></i>Try Again
            </button>
        </div>

        <!-- Video Gallery Grid -->
        <div id="videoGallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 hidden">
            <!-- Thumbnails will be inserted here -->
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-video-slash text-5xl text-gray-600 mb-4"></i>
            <p class="text-xl text-gray-400">No videos found</p>
        </div>

        <!-- Pagination -->
        <div id="paginationContainer" class="mt-8 hidden">
            <div id="pagination" class="flex flex-wrap justify-center items-center gap-2">
                <!-- Pagination buttons will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/90" onclick="closeVideoModal()"></div>
        <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
            <div class="flex flex-col items-center w-full">
                <!-- Modal Header -->
                <div class="flex justify-between items-center mb-2 w-full max-w-4xl px-2">
                    <h3 id="videoTitle" class="text-lg font-semibold truncate pr-4 flex-1"></h3>
                    <button onclick="closeVideoModal()" class="p-2 hover:bg-gray-800 rounded-full transition-colors flex-shrink-0">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                
                <!-- Video Player Container - Responsive for both portrait and landscape -->
                <div id="videoContainer" class="relative bg-black rounded-lg overflow-hidden flex items-center justify-center">
                    <!-- Video Loading -->
                    <div id="videoLoading" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-10">
                        <div class="loader"></div>
                    </div>
                    
                    <!-- Video Player -->
                    <video 
                        id="videoPlayer" 
                        class="video-responsive"
                        controls 
                        playsinline
                        preload="metadata"
                    >
                        Your browser does not support the video tag.
                    </video>
                </div>

                <!-- Video Controls Info -->
                <div class="mt-3 flex justify-between items-center text-sm text-gray-400 w-full max-w-4xl px-2">
                    <span>Tap video for controls</span>
                    <button onclick="toggleFullscreen()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg transition-colors">
                        <i class="fas fa-expand mr-2"></i>Fullscreen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            baseUrl: 'https://www.kamababa.desi',
            corsProxy: 'https://corsproxy.io/?url=',
            // Alternative proxies if needed:
            // corsProxy: 'https://api.allorigins.win/raw?url=',
            // corsProxy: 'https://api.cors.lol/?url=',
            // corsProxy: 'https://api.codetabs.com/v1/proxy?quest=',
        };

        // State
        let currentState = {
            page: 1,
            searchQuery: '',
            isSearching: false
        };

        // DOM Elements
        const elements = {
            homeBtn: document.getElementById('homeBtn'),
            searchForm: document.getElementById('searchForm'),
            searchInput: document.getElementById('searchInput'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            errorMessage: document.getElementById('errorMessage'),
            errorText: document.getElementById('errorText'),
            videoGallery: document.getElementById('videoGallery'),
            noResults: document.getElementById('noResults'),
            paginationContainer: document.getElementById('paginationContainer'),
            pagination: document.getElementById('pagination'),
            videoModal: document.getElementById('videoModal'),
            videoContainer: document.getElementById('videoContainer'),
            videoPlayer: document.getElementById('videoPlayer'),
            videoLoading: document.getElementById('videoLoading'),
            videoTitle: document.getElementById('videoTitle'),
            pageInfo: document.getElementById('pageInfo'),
            pageInfoText: document.getElementById('pageInfoText')
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadHomePage();
            setupEventListeners();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            elements.homeBtn.addEventListener('click', () => {
                currentState = { page: 1, searchQuery: '', isSearching: false };
                elements.searchInput.value = '';
                loadHomePage();
            });

            elements.searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = elements.searchInput.value.trim();
                if (query) {
                    currentState = { page: 1, searchQuery: query, isSearching: true };
                    loadSearchResults(query, 1);
                }
            });

            // Close modal on escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeVideoModal();
                }
            });

            // Video player events
            elements.videoPlayer.addEventListener('loadeddata', () => {
                elements.videoLoading.classList.add('hidden');
            });

            elements.videoPlayer.addEventListener('canplay', () => {
                elements.videoLoading.classList.add('hidden');
            });

            elements.videoPlayer.addEventListener('error', () => {
                elements.videoLoading.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-2"></i>
                        <p class="text-gray-400">Failed to load video</p>
                    </div>
                `;
            });
        }

        // Fetch with CORS proxy
        async function fetchWithProxy(url) {
            const proxyUrl = CONFIG.corsProxy + encodeURIComponent(url);
            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.text();
        }

        // Build URL based on current state
        function buildUrl(page = 1, searchQuery = '') {
            let url = CONFIG.baseUrl;
            
            if (searchQuery) {
                if (page > 1) {
                    url = `${CONFIG.baseUrl}/page/${page}/?s=${encodeURIComponent(searchQuery)}`;
                } else {
                    url = `${CONFIG.baseUrl}/?s=${encodeURIComponent(searchQuery)}`;
                }
            } else {
                if (page > 1) {
                    url = `${CONFIG.baseUrl}/page/${page}/`;
                }
            }
            
            return url;
        }

        // Show loading state
        function showLoading() {
            elements.loadingIndicator.classList.remove('hidden');
            elements.videoGallery.classList.add('hidden');
            elements.errorMessage.classList.add('hidden');
            elements.noResults.classList.add('hidden');
            elements.paginationContainer.classList.add('hidden');
        }

        // Show error state
        function showError(message) {
            elements.loadingIndicator.classList.add('hidden');
            elements.videoGallery.classList.add('hidden');
            elements.errorMessage.classList.remove('hidden');
            elements.noResults.classList.add('hidden');
            elements.paginationContainer.classList.add('hidden');
            elements.errorText.textContent = message;
        }

        // Show no results state
        function showNoResults() {
            elements.loadingIndicator.classList.add('hidden');
            elements.videoGallery.classList.add('hidden');
            elements.errorMessage.classList.add('hidden');
            elements.noResults.classList.remove('hidden');
            elements.paginationContainer.classList.add('hidden');
        }

        // Show gallery
        function showGallery() {
            elements.loadingIndicator.classList.add('hidden');
            elements.videoGallery.classList.remove('hidden');
            elements.errorMessage.classList.add('hidden');
            elements.noResults.classList.add('hidden');
        }

        // Parse HTML and extract video data
        function parseVideoList(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const videos = [];
            
            // Find the video list container
            const videoListContent = doc.querySelector('.video-list-content');
            if (!videoListContent) {
                console.log('Could not find .video-list-content');
                return { videos: [], pagination: null };
            }

            const videosList = videoListContent.querySelector('.videos-list');
            if (!videosList) {
                console.log('Could not find .videos-list');
                return { videos: [], pagination: null };
            }

            // Find all article elements
            const articles = videosList.querySelectorAll('article');
            
            articles.forEach(article => {
                const link = article.querySelector('a[href]');
                const thumbnail = article.querySelector('.post-thumbnail img');
                const title = article.querySelector('.entry-title, h2, h3')?.textContent?.trim() || 
                             thumbnail?.getAttribute('alt') || 
                             thumbnail?.getAttribute('title') || 
                             'Untitled Video';
                
                if (link && thumbnail) {
                    const imgSrc = thumbnail.getAttribute('data-src') || 
                                   thumbnail.getAttribute('data-lazy-src') || 
                                   thumbnail.getAttribute('src') || '';
                    
                    videos.push({
                        url: link.getAttribute('href'),
                        thumbnail: imgSrc,
                        title: title
                    });
                }
            });

            // Parse pagination
            const paginationData = parsePagination(doc);

            return { videos, pagination: paginationData };
        }

        // Parse pagination
        function parsePagination(doc) {
            const paginationDiv = doc.querySelector('.pagination');
            if (!paginationDiv) return null;

            const links = paginationDiv.querySelectorAll('a');
            const pages = [];
            let currentPage = 1;
            let lastPage = 1;
            let nextPage = null;
            let prevPage = null;

            links.forEach(link => {
                const text = link.textContent.trim();
                const href = link.getAttribute('href') || '';
                const isCurrent = link.classList.contains('current');

                if (isCurrent) {
                    currentPage = parseInt(text) || 1;
                } else if (text === 'Next') {
                    nextPage = href;
                } else if (text === 'Last') {
                    // Extract last page number from URL
                    const match = href.match(/\/page\/(\d+)/);
                    if (match) {
                        lastPage = parseInt(match[1]);
                    }
                } else if (text === 'Previous' || text === 'Prev') {
                    prevPage = href;
                } else if (!isNaN(parseInt(text))) {
                    pages.push({
                        number: parseInt(text),
                        href: href,
                        isCurrent: isCurrent
                    });
                }
            });

            // Update lastPage if we found numbered pages
            if (pages.length > 0) {
                const maxPageNum = Math.max(...pages.map(p => p.number));
                if (maxPageNum > lastPage) {
                    lastPage = maxPageNum;
                }
            }

            return {
                currentPage,
                lastPage,
                nextPage,
                prevPage,
                pages
            };
        }

        // Render video gallery
        function renderGallery(videos) {
            elements.videoGallery.innerHTML = '';

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'thumbnail-card bg-gray-800 rounded-lg overflow-hidden cursor-pointer';
                card.onclick = () => openVideo(video.url, video.title);

                card.innerHTML = `
                    <div class="relative aspect-video bg-gray-700 img-placeholder">
                        <img 
                            src="${video.thumbnail}" 
                            alt="${escapeHtml(video.title)}"
                            class="absolute inset-0 w-full h-full object-cover"
                            loading="lazy"
                            onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23374151%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236b7280%22 font-size=%2212%22>No Image</text></svg>';"
                            onload="this.parentElement.classList.remove('img-placeholder');"
                        >
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity bg-black/50">
                            <i class="fas fa-play-circle text-5xl text-white/90"></i>
                        </div>
                    </div>
                    <div class="p-2">
                        <p class="text-sm text-gray-300 line-clamp-2" title="${escapeHtml(video.title)}">
                            ${escapeHtml(video.title)}
                        </p>
                    </div>
                `;

                elements.videoGallery.appendChild(card);
            });
        }

        // Render pagination
        function renderPagination(paginationData) {
            if (!paginationData || paginationData.lastPage <= 1) {
                elements.paginationContainer.classList.add('hidden');
                return;
            }

            elements.pagination.innerHTML = '';
            elements.paginationContainer.classList.remove('hidden');

            const { currentPage, lastPage } = paginationData;

            // Previous button
            const prevBtn = createPaginationButton('Prev', currentPage > 1, () => goToPage(currentPage - 1));
            prevBtn.innerHTML = '<i class="fas fa-chevron-left mr-1"></i>Prev';
            elements.pagination.appendChild(prevBtn);

            // Page numbers
            const pageNumbers = generatePageNumbers(currentPage, lastPage);
            
            pageNumbers.forEach(pageNum => {
                if (pageNum === '...') {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'px-2 py-1 text-gray-500';
                    ellipsis.textContent = '...';
                    elements.pagination.appendChild(ellipsis);
                } else {
                    const btn = createPaginationButton(
                        pageNum.toString(),
                        true,
                        () => goToPage(pageNum),
                        pageNum === currentPage
                    );
                    elements.pagination.appendChild(btn);
                }
            });

            // Next button
            const nextBtn = createPaginationButton('Next', currentPage < lastPage, () => goToPage(currentPage + 1));
            nextBtn.innerHTML = 'Next<i class="fas fa-chevron-right ml-1"></i>';
            elements.pagination.appendChild(nextBtn);
        }

        // Generate page numbers array
        function generatePageNumbers(currentPage, lastPage) {
            const pages = [];
            const delta = 2; // Number of pages to show on each side of current page

            if (lastPage <= 7) {
                // Show all pages if there are 7 or fewer
                for (let i = 1; i <= lastPage; i++) {
                    pages.push(i);
                }
            } else {
                // Always show first page
                pages.push(1);

                // Calculate range around current page
                let rangeStart = Math.max(2, currentPage - delta);
                let rangeEnd = Math.min(lastPage - 1, currentPage + delta);

                // Adjust range if at the beginning or end
                if (currentPage <= delta + 2) {
                    rangeEnd = Math.min(lastPage - 1, 5);
                }
                if (currentPage >= lastPage - delta - 1) {
                    rangeStart = Math.max(2, lastPage - 4);
                }

                // Add ellipsis before range if needed
                if (rangeStart > 2) {
                    pages.push('...');
                }

                // Add range
                for (let i = rangeStart; i <= rangeEnd; i++) {
                    pages.push(i);
                }

                // Add ellipsis after range if needed
                if (rangeEnd < lastPage - 1) {
                    pages.push('...');
                }

                // Always show last page
                pages.push(lastPage);
            }

            return pages;
        }

        // Create pagination button
        function createPaginationButton(text, enabled, onClick, isActive = false) {
            const btn = document.createElement('button');
            btn.className = `pagination-btn px-3 py-2 rounded-lg text-sm font-medium ${
                isActive 
                    ? 'active bg-blue-600 text-white' 
                    : enabled 
                        ? 'bg-gray-700 text-gray-300 hover:bg-blue-600 hover:text-white' 
                        : 'bg-gray-800 text-gray-600 cursor-not-allowed'
            }`;
            btn.textContent = text;
            btn.disabled = !enabled;
            if (enabled && !isActive) {
                btn.onclick = onClick;
            }
            return btn;
        }

        // Go to specific page
        function goToPage(page) {
            currentState.page = page;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (currentState.isSearching) {
                loadSearchResults(currentState.searchQuery, page);
            } else {
                loadPage(page);
            }
        }

        // Load home page
        async function loadHomePage() {
            showLoading();
            updatePageInfo();

            try {
                const url = buildUrl(1);
                const html = await fetchWithProxy(url);
                const { videos, pagination } = parseVideoList(html);

                if (videos.length === 0) {
                    showNoResults();
                    return;
                }

                renderGallery(videos);
                renderPagination(pagination);
                showGallery();
            } catch (error) {
                console.error('Error loading home page:', error);
                showError(error.message);
            }
        }

        // Load specific page
        async function loadPage(page) {
            showLoading();
            updatePageInfo();

            try {
                const url = buildUrl(page);
                const html = await fetchWithProxy(url);
                const { videos, pagination } = parseVideoList(html);

                if (videos.length === 0) {
                    showNoResults();
                    return;
                }

                renderGallery(videos);
                renderPagination(pagination);
                showGallery();
            } catch (error) {
                console.error('Error loading page:', error);
                showError(error.message);
            }
        }

        // Load search results
        async function loadSearchResults(query, page = 1) {
            showLoading();
            updatePageInfo();

            try {
                const url = buildUrl(page, query);
                const html = await fetchWithProxy(url);
                const { videos, pagination } = parseVideoList(html);

                if (videos.length === 0) {
                    showNoResults();
                    return;
                }

                renderGallery(videos);
                renderPagination(pagination);
                showGallery();
            } catch (error) {
                console.error('Error loading search results:', error);
                showError(error.message);
            }
        }

        // Update page info display
        function updatePageInfo() {
            if (currentState.isSearching) {
                elements.pageInfo.classList.remove('hidden');
                elements.pageInfoText.textContent = `Search results for "${currentState.searchQuery}" - Page ${currentState.page}`;
            } else if (currentState.page > 1) {
                elements.pageInfo.classList.remove('hidden');
                elements.pageInfoText.textContent = `Page ${currentState.page}`;
            } else {
                elements.pageInfo.classList.add('hidden');
            }
        }

        // Retry loading
        function retryLoad() {
            if (currentState.isSearching) {
                loadSearchResults(currentState.searchQuery, currentState.page);
            } else {
                loadPage(currentState.page);
            }
        }

        // Open video modal and fetch video URL
        async function openVideo(pageUrl, title) {
            elements.videoModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            elements.videoTitle.textContent = title || 'Loading...';
            elements.videoLoading.classList.remove('hidden');
            elements.videoLoading.innerHTML = '<div class="loader"></div>';
            elements.videoPlayer.src = '';

            try {
                const html = await fetchWithProxy(pageUrl);
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Find video URL from meta tag
                const contentUrlMeta = doc.querySelector('meta[itemprop="contentURL"]');
                let videoUrl = contentUrlMeta?.getAttribute('content');

                // Alternative: try to find video source directly
                if (!videoUrl) {
                    const videoSource = doc.querySelector('video source[src]');
                    videoUrl = videoSource?.getAttribute('src');
                }

                // Alternative: try to find video element with src
                if (!videoUrl) {
                    const videoElement = doc.querySelector('video[src]');
                    videoUrl = videoElement?.getAttribute('src');
                }

                // Alternative: search for mp4 URL in page content
                if (!videoUrl) {
                    const mp4Match = html.match(/https?:\/\/[^"'\s]+\.mp4/i);
                    videoUrl = mp4Match ? mp4Match[0] : null;
                }

                if (!videoUrl) {
                    throw new Error('Could not find video URL');
                }

                // Update title if found
                const pageTitle = doc.querySelector('title')?.textContent || 
                                  doc.querySelector('h1')?.textContent || 
                                  title;
                elements.videoTitle.textContent = pageTitle;

                // Load video
                elements.videoPlayer.src = videoUrl;
                elements.videoPlayer.load();
                elements.videoPlayer.play().catch(() => {
                    // Auto-play might be blocked, that's okay
                });

            } catch (error) {
                console.error('Error loading video:', error);
                elements.videoLoading.innerHTML = `
                    <div class="text-center p-4">
                        <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-3"></i>
                        <p class="text-gray-300 mb-2">Failed to load video</p>
                        <p class="text-gray-500 text-sm">${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        }

        // Close video modal
        function closeVideoModal() {
            elements.videoModal.classList.add('hidden');
            document.body.style.overflow = '';
            elements.videoPlayer.pause();
            elements.videoPlayer.src = '';
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            const videoContainer = elements.videoPlayer.parentElement;
            
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else if (elements.videoPlayer.requestFullscreen) {
                elements.videoPlayer.requestFullscreen();
            } else if (elements.videoPlayer.webkitRequestFullscreen) {
                elements.videoPlayer.webkitRequestFullscreen();
            } else if (elements.videoPlayer.webkitEnterFullscreen) {
                // iOS Safari
                elements.videoPlayer.webkitEnterFullscreen();
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
